---
name: hashistack-test

services:
  consul:
    image: mirror.gcr.io/hashicorp/consul:2.0.4
    command:
      - agent
      - -dev
      - -client=0.0.0.0
      - -hcl=acl { enabled = true default_policy = "deny" tokens { initial_management = "test-consul-management" } }
    ports:
      - 127.0.0.1:18500:8500

  vault:
    image: mirror.gcr.io/hashicorp/vault:2.1.1
    command:
      - server
      - -dev
      - -dev-root-token-id=test-vault-root
      - -dev-listen-address=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - 127.0.0.1:18200:8200

  ca-certificates:
    image: mirror.gcr.io/hashicorp/consul:2.0.4
    entrypoint: ["true"]
    volumes:
      - ca-certificates:/etc/ssl/certs

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    environment:
      PEBBLE_VA_ALWAYS_VALID: "1"
      PEBBLE_VA_NOSLEEP: "1"
    ports:
      - 127.0.0.1:15000:15000

  nomad:
    image: mirror.gcr.io/hashicorp/nomad:2.0.7
    command:
      - agent
      - -dev
      - -bind=0.0.0.0
      - -config=/etc/nomad.d/nomad.hcl
    volumes:
      - ./nomad.hcl:/etc/nomad.d/nomad.hcl:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ca-certificates:/etc/ssl/certs:ro
    cgroup: host
    privileged: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "1024"
    depends_on:
      consul:
        condition: service_started
      vault:
        condition: service_started
      pebble:
        condition: service_started
      ca-certificates:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:14646:4646
      - 127.0.0.1:18443:443
      - 127.0.0.1:18080:80
      - 127.0.0.1:19443:9443

volumes:
  ca-certificates:
